<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Reviewer Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--font:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"Geist Mono",ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;--ease:cubic-bezier(.2,.7,.2,1)}
[data-theme="dark"]{color-scheme:dark;
  --bg:#0D1014;--side:#0A0C10;--card:#14181E;--card-2:#1B2028;--hover:#1A1F27;--line:#252B34;--line-2:#39424E;
  --text:#EDF1F5;--text-2:#AAB4C0;--text-3:#808B98;
  --accent:#B9F24A;--on-accent:#12180A;--accent-soft:rgba(185,242,74,.1);
  --red:#FF7B7B;--red-soft:rgba(255,123,123,.12);--amber:#FFBE5C;--amber-soft:rgba(255,190,92,.12);--blue:#7CC0FF;--blue-soft:rgba(124,192,255,.12);--green:#62E0A5;--green-soft:rgba(98,224,165,.12);
  --add:rgba(98,224,165,.08);--del:rgba(255,123,123,.08);--kw:#C9A7FF;--str:#A5E3A0;--com:#7D8997;--num:#FFC285;--shadow:0 24px 70px rgba(0,0,0,.55)}
[data-theme="light"]{color-scheme:light;
  --bg:#F7F8FA;--side:#EFF1F4;--card:#FFFFFF;--card-2:#F2F4F7;--hover:#F1F3F6;--line:#E2E6EB;--line-2:#C6CDD6;
  --text:#14191F;--text-2:#4C5763;--text-3:#67727F;
  --accent:#4F7A00;--on-accent:#FFFFFF;--accent-soft:rgba(79,122,0,.09);
  --red:#C62828;--red-soft:rgba(198,40,40,.08);--amber:#9A5700;--amber-soft:rgba(154,87,0,.09);--blue:#0B66C2;--blue-soft:rgba(11,102,194,.08);--green:#0A7F4F;--green-soft:rgba(10,127,79,.09);
  --add:rgba(10,127,79,.08);--del:rgba(198,40,40,.07);--kw:#7A3EC8;--str:#2F7D32;--com:#6F7B88;--num:#B25A00;--shadow:0 24px 70px rgba(20,30,45,.2)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,p{margin:0}
[tabindex="-1"]:focus{outline:none}
code{font-family:var(--mono);font-size:.9em}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;border:3px solid transparent;background-clip:content-box}

/* Window */
.app{height:100%;display:grid;grid-template-columns:216px minmax(0,1fr);grid-template-rows:34px minmax(0,1fr)}
.winbar{grid-column:1/-1;display:flex;align-items:center;background:var(--side);padding-left:14px}
.traffic{display:none;gap:8px}.traffic i{width:12px;height:12px;border-radius:50%}
.traffic i:nth-child(1){background:#FF5F57}.traffic i:nth-child(2){background:#FEBC2E}.traffic i:nth-child(3){background:#28C840}
.os-mac .traffic{display:flex}.os-mac .winctl{display:none}
.winctl{margin-left:auto;display:flex;height:100%}.winctl span{width:44px;display:grid;place-items:center;color:var(--text-3)}

/* Sidebar */
.side{background:var(--side);display:flex;flex-direction:column;padding:6px 12px 14px;min-height:0}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px;letter-spacing:-.015em;padding:4px 10px 16px}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:600 13px var(--font)}
.nav{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border-radius:9px;color:var(--text-2);font-weight:500;margin-bottom:2px}
.nav:hover{background:var(--hover);color:var(--text)}
.nav[aria-current="page"]{background:var(--card-2);color:var(--text)}
.nav svg{flex:none}
.nav .count{margin-left:auto;font-size:12.5px;font-weight:600;min-width:22px;text-align:center;border-radius:11px;background:var(--accent);color:var(--on-accent);line-height:20px}
.nav kbd{margin-left:auto}
kbd{font:500 11px var(--font);padding:1px 6px;border:1px solid var(--line-2);border-radius:5px;color:var(--text-3);white-space:nowrap}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border-radius:9px;font-size:13px;color:var(--text-2)}
.side-foot:hover{background:var(--hover);color:var(--text)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}

/* Main */
main{background:var(--bg);border-top-left-radius:14px;border:1px solid var(--line);border-width:1px 0 0 1px;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;overflow:auto;min-height:0}
.col{max-width:820px;margin:0 auto;padding:36px 32px 56px}
.page-title{font-size:27px;font-weight:600;letter-spacing:-.025em;line-height:1.2}
.page-sub{color:var(--text-2);margin-top:6px;max-width:62ch}
.section-title{font-size:13.5px;font-weight:600;color:var(--text-2);margin:30px 0 8px}
.section-title:first-child{margin-top:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:10px;background:var(--card-2);border:1px solid var(--line-2);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover);border-color:var(--text-3)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.small{height:32px;padding:0 12px;font-size:13.5px;border-radius:8px}
.link{color:var(--text-2);font-size:14px;font-weight:500;padding:2px 0;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.link:hover{color:var(--text);text-decoration-color:currentColor}
.input{width:100%;height:40px;padding:0 13px;border-radius:10px;border:1px solid var(--line-2);background:var(--card);color:var(--text)}
.input::placeholder,textarea::placeholder{color:var(--text-3)}
textarea.input{height:auto;padding:10px 13px;resize:vertical;display:block}
select.input{width:auto;padding-right:8px}

/* Reviews list */
.tools{display:flex;gap:10px;margin:24px 0 8px}
.tools input.input{flex:1}
.tools select.input{flex:none;width:auto}
.tools+#homeList .section-title:first-child{margin-top:22px}
.row{display:flex;align-items:center;gap:18px;width:100%;padding:15px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;transition:border-color .15s,background .15s}
.row:hover{border-color:var(--line-2);background:var(--hover)}
.row-main{min-width:0;flex:1}
.row-title{font-weight:500;font-size:15.5px;letter-spacing:-.006em;line-height:1.35}
.row-meta{color:var(--text-3);font-size:13.5px;margin-top:2px}
.row-end{flex:none;text-align:right;max-width:230px}
.outcome{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;white-space:nowrap}
.row-count{color:var(--text-3);font-size:13px;display:block}
.c-red{color:var(--red)}.c-amber{color:var(--amber)}.c-blue{color:var(--blue)}.c-green{color:var(--green)}.c-muted{color:var(--text-3)}.c-accent{color:var(--accent)}
.bar{width:150px;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .6s var(--ease)}
.empty{padding:48px 24px;text-align:center;color:var(--text-2);background:var(--card);border:1px dashed var(--line-2);border-radius:14px}
.empty b{display:block;color:var(--text);font-size:17px;font-weight:600;margin-bottom:4px}
.empty .btn{margin-top:16px}

/* Review */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--text-2);font-size:14px;font-weight:500;margin-bottom:18px}
.back:hover{color:var(--text)}
.rv-title{font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.rv-meta{color:var(--text-3);font-size:14px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.rv-links{display:inline-flex;gap:14px;margin-left:auto}
.answer{margin-top:20px;padding:20px 22px;border-radius:14px;background:var(--tone-soft);}
.answer-word{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:600;letter-spacing:-.018em;color:var(--tone)}
.answer p{margin-top:6px;font-size:15.5px;line-height:1.55}
.answer small{display:block;margin-top:10px;font-size:13.5px;color:var(--text-2)}
.answer small button{font-size:inherit}
.tabs{display:flex;gap:22px;margin-top:24px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:8px 1px 10px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--text-2);font-weight:500;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-color:var(--text)}
.tab-body{padding-top:16px}

/* Issues */
.issue{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.issue.open{border-color:var(--line-2)}
.issue-head{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px}
.issue-head:hover{background:var(--hover)}
.issue-title{font-weight:500;min-width:0;flex:1;line-height:1.35}
.issue.off .issue-title{color:var(--text-3);text-decoration:line-through}
.sev{flex:none;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:7px;white-space:nowrap}
.s-blocker{color:var(--red);background:var(--red-soft)}.s-major{color:var(--amber);background:var(--amber-soft)}.s-minor,.s-nit{color:var(--blue);background:var(--blue-soft)}
.chev{flex:none;color:var(--text-3);transition:transform .15s}
.issue.open .chev{transform:rotate(180deg)}
.issue-body{padding:4px 16px 16px}
.issue-body h4{font-size:13.5px;font-weight:600;color:var(--text-2);margin:16px 0 3px}
.issue-body h4:first-child{margin-top:4px}
.issue-body>p{max-width:68ch}
.better-box{margin-top:16px;padding:14px 16px;background:var(--accent-soft);border-radius:10px}
.better-box h4{color:var(--accent);margin:0 0 3px;font-size:14px}
pre.code{margin:8px 0 0;padding:10px 0;border-radius:9px;background:var(--bg);border:1px solid var(--line);font:13px/21px var(--mono);overflow:auto}
pre.code .ln{display:block;padding:0 14px;min-width:max-content}
pre.code .ln.hit{background:var(--red-soft)}
.code-head{display:flex;align-items:center;justify-content:space-between;font:12.5px var(--mono);color:var(--text-3);margin-top:12px}
.better-box pre.code{padding:10px 14px;background:var(--card)}
.source{font-size:13.500px;color:var(--text-2);margin-top:12px;display:flex;gap:7px;align-items:flex-start}
.source svg{flex:none;margin-top:3px}
.issue-foot{display:flex;align-items:center;gap:16px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.toggle{display:inline-flex;align-items:center;gap:10px;font-weight:500;font-size:14px;cursor:pointer}
.switch{width:38px;height:22px;border-radius:11px;background:var(--line-2);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(16px);background:var(--on-accent)}
.issue-foot .right{margin-left:auto;display:flex;gap:14px}
.inline-form{margin-top:12px}
.inline-form .acts{display:flex;gap:8px;margin-top:8px}
.qa{margin-top:12px;font-size:14px;padding:10px 12px;background:var(--card-2);border-radius:9px}
.qa b{font-weight:600;display:block}
.qa span{color:var(--text-2)}
.send-bar{flex:none;display:flex;align-items:center;gap:16px;padding:12px 32px;border-top:1px solid var(--line);background:var(--card)}
.send-bar span{color:var(--text-2);font-size:14px}
.send-bar .btn{margin-left:auto}

/* Lists */
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.li{display:flex;gap:12px;padding:12px 16px;align-items:flex-start;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li-main{min-width:0;flex:1}
.li-main b{font-weight:500;display:block;line-height:1.4;overflow-wrap:anywhere}
.li-main small{display:block;color:var(--text-3);font-size:13.5px;line-height:1.45}
.li-end{flex:none;display:flex;align-items:center;gap:12px;font-size:13.5px}
.li.center{align-items:center}
.li-btn{width:100%}.li-btn:hover{background:var(--hover)}
.icon{flex:none;margin-top:3px}
.li.center .icon{margin-top:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13.5px;padding:3px 11px;border-radius:8px;background:var(--card-2);color:var(--text-2)}
details.more{margin-top:8px}
details.more summary{cursor:pointer;color:var(--text-2);font-weight:500;font-size:14px;padding:6px 0}
details.more summary:hover{color:var(--text)}

/* Diff */
.file{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.file-name{padding:9px 14px;font:500 13px var(--mono);color:var(--text-2);border-bottom:1px solid var(--line)}
.diff{font:13px/21px var(--mono);overflow:auto}
.dl{display:grid;grid-template-columns:48px 22px 1fr;white-space:pre;min-width:max-content}
.dl .n{color:var(--text-3);text-align:right;padding-right:10px;font-size:12px;user-select:none}
.dl .g{text-align:center;color:var(--text-3);user-select:none}
.dl.add{background:var(--add)}.dl.del{background:var(--del)}
.dl.hunk{grid-template-columns:1fr;padding:2px 14px;color:var(--text-3);background:var(--card-2)}
.dl-flag{font:500 12.5px var(--font);margin:4px 14px 6px 70px;white-space:normal}
.k{color:var(--kw)}.st{color:var(--str)}.cm{color:var(--com)}.nu{color:var(--num)}

/* Progress */
.steps{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 20px}
.step{display:flex;gap:14px;padding:13px 0;align-items:flex-start;color:var(--text-3)}
.step+.step{border-top:1px solid var(--line)}
.step b{font-weight:500;display:block}
.step small{font-size:13.5px}
.step.now{color:var(--text)}.step.now small{color:var(--text-2)}
.step.done{color:var(--text-2)}
.step-i{flex:none;width:22px;height:22px;margin-top:1px;border-radius:50%;display:grid;place-items:center;border:1.500px solid var(--line-2)}
.step.done .step-i{background:var(--green-soft);border-color:transparent;color:var(--green)}
.step.now .step-i{border-color:var(--accent)}
.step.now .step-i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}

/* Upload */
.drop{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:30px 20px;border:1.500px dashed var(--line-2);border-radius:14px;background:var(--card);transition:.15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-weight:600;font-size:16px}
.drop small{color:var(--text-3);font-size:13.5px}
.drop .btn{margin-top:10px}
.drop svg{color:var(--text-3);margin-bottom:4px}
.up-error{color:var(--red);font-size:14px;margin-top:8px}
.notice{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:10px;padding:12px 16px;border-radius:12px;background:var(--accent-soft);font-size:14px}
.notice .btn{margin-left:auto}
.ftype{flex:none;width:38px;height:42px;border-radius:7px;background:var(--card-2);border:1px solid var(--line);display:grid;place-items:center;font:600 10.500px var(--font);letter-spacing:.02em;color:var(--text-2)}
.note{font-size:13.5px;color:var(--text-3);margin-top:10px}
select.mini{height:32px;font-size:13.5px;border-radius:8px;padding:0 6px;background:var(--card-2);border:1px solid var(--line-2)}
.add-rule{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
.add-rule:first-child{border-top:0}
.add-rule .input{height:36px}
.seg{display:inline-flex;background:var(--card-2);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:4px 13px;border-radius:7px;font-size:13.5px;color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.2)}

/* Compliance and standards */
.std-badge{flex:none;width:38px;height:38px;border-radius:9px;background:var(--card-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--text-2)}
.ctl{display:inline-block;font:500 12.5px/1.6 var(--mono);padding:0 7px;border-radius:6px;background:var(--card-2);color:var(--text);white-space:nowrap;margin:0 4px 4px 0}
.comp-line{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-top:10px;font-size:13.5px;color:var(--text-2)}
.comp-line svg{flex:none}
.comp-line b{font-weight:500;color:var(--text)}
.pick-list{max-height:min(50vh,440px);overflow:auto;margin:10px -10px 0;padding:0 2px}
.pick-cat{font-size:12.5px;font-weight:600;color:var(--text-3);margin:14px 10px 2px}
.pick-cat:first-child{margin-top:4px}
.pick{display:flex;gap:12px;padding:9px 10px;border-radius:10px;cursor:pointer;align-items:flex-start}
.pick:hover{background:var(--hover)}
.pick input{flex:none;width:16px;height:16px;margin:4px 0 0;accent-color:var(--accent)}
.pick b{font-weight:500}
.pick small{display:block;color:var(--text-3);font-size:13.5px;line-height:1.45}
.pick.added{cursor:default}.pick.added b,.pick.added small{opacity:.6}
.region{display:inline-block;font-size:12px;font-weight:500;color:var(--text-3);border:1px solid var(--line-2);border-radius:6px;padding:0 6px;margin-left:8px;vertical-align:1px;white-space:nowrap}
.d-foot .grow{margin-right:auto;align-self:center;color:var(--text-2);font-size:14px}
/* Review by link */
.tag{display:inline-block;font-size:12px;font-weight:600;line-height:18px;padding:0 7px;border-radius:6px;background:var(--card-2);border:1px solid var(--line-2);color:var(--text-2);vertical-align:1px}
.link-info{display:flex;gap:8px;align-items:center;min-height:22px;margin-top:10px;font-size:14px;color:var(--text-2)}
.link-info.bad{color:var(--red)}
.link-info.good svg{color:var(--green)}
.tools .btn{flex:none}
/* Dialog and toast */
dialog.wide{width:min(640px,calc(100vw - 32px))}
dialog{width:min(520px,calc(100vw - 32px));padding:0;background:var(--card);color:var(--text);border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow);margin-top:13vh}
dialog::backdrop{background:rgba(5,7,10,.55);backdrop-filter:blur(3px)}
.d-head{padding:20px 22px 6px}.d-head h2{font-size:19px;font-weight:600;letter-spacing:-.015em}.d-head p{color:var(--text-2);font-size:14px;margin-top:2px}
.d-body{padding:10px 22px 16px}
.d-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--line)}
.choice{display:flex;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;cursor:pointer}
.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input{accent-color:var(--accent);margin:4px 0 0}
.choice b{font-weight:500;display:block}.choice small{color:var(--text-2);font-size:13.5px}
label.field{display:block;font-size:14px;font-weight:500;margin-bottom:12px}
label.field .input{margin-top:5px;font-weight:400;width:100%}
.palette-input{width:100%;height:52px;border:0;border-bottom:1px solid var(--line);background:none;padding:0 20px;font-size:16px;outline:none}
.palette-list{max-height:340px;overflow:auto;padding:6px}
.pal{display:flex;gap:12px;width:100%;padding:9px 14px;border-radius:9px;align-items:center}
.pal small{margin-left:auto;color:var(--text-3);font-size:13px;flex:none}
.pal:hover,.pal.sel{background:var(--hover)}

const ICON={
 check:s=>`<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 6.500 12 13 4.500"/></svg>`,

 shield:s=>`<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.500" stroke-linejoin="round"><path d="M8 1.500 13.500 3.500v4c0 3.300-2.300 5.800-5.500 7-3.200-1.200-5.500-3.700-5.500-7v-4z"/><path d="m5.800 8 1.600 1.600L10.400 6.500" stroke-linecap="round"/></svg>`
};
const VERDICT_ICON={request_changes:ICON.cross,needs_discussion:ICON.ask,approve_with_comments:ICON.check,approve:ICON.check};

function highlight(t){
  let s=esc(t);const parts=[];const stash=x=>{parts.push(x);return "\u0000"+(parts.length-1)+"\u0000"};
  s=s.replace(/(\/\/.*$|(^|\s)#\s.*$)/,m=>stash(`<span class="cm">${m}</span>`));
  s=s.replace(/(&quot;[^&]*?&quot;|'[^']*'|`[^`]*`)/g,m=>stash(`<span class="st">${m}</span>`));
  s=s.replace(/\b(async|await|const|let|var|return|if|else|for|in|def|func|function|export|class|import|from|new)\b/g,'<span class="k">$1</span>');
  s=s.replace(/(?<!\u0000)\b(\d+)\b(?!\u0000)/g,'<span class="nu">$1</span>');
  return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>parts[+i]);
}

/* Reviews list */
function viewReviews(){
  if(!anyAccount()) return `<div class="col"><h1 class="page-title" tabindex="-1" id="vh">Reviews</h1><div class="empty" style="margin-top:24px"><b>Connect an account to get started</b>Link GitHub, GitLab or Bitbucket. Anything assigned to you will show up here and get reviewed automatically.<br><button class="btn primary" data-a="nav" data-v="settings">Connect an account</button></div></div>`;
  const ready=PRS.filter(p=>connected(p.provider)&&p.state==="ready").length;
  const accts=[...new Set(S.accounts.filter(a=>a.on).map(a=>a.p))];
  return `<div class="col">
   <h1 class="page-title" tabindex="-1" id="vh">${ready?`${plural(ready,"review")} need${ready===1?"s":""} your decision`:"You're all caught up"}</h1>
   <p class="page-sub">Anything assigned to you appears here and gets reviewed automatically.</p>
   <div class="tools"><input class="input" id="q" placeholder="Search by title, project or person" aria-label="Search reviews" value="${esc(S.q)}">
    <select class="input" id="acctFilter" aria-label="Filter by account"><option value="all">All accounts</option>${accts.map(k=>`<option value="${k}" ${S.acct===k?"selected":""}>${PROV[k].name}</option>`).join("")}</select>
    <button class="btn" data-a="linkdlg">${ICON.link(16)}Review by link</button></div>
   <div id="homeList">${homeList()}</div></div>`;
}
function homeList(){
  const q=S.q.trim().toLowerCase();
  const v=PRS.filter(p=>connected(p.provider)&&(S.acct==="all"||p.provider===S.acct)&&(!q||(p.title+p.repo+p.author+p.num).toLowerCase().includes(q)));
  if(!v.length) return `<div class="empty"><b>${q||S.acct!=="all"?"No matches":"Nothing assigned to you"}</b>${q||S.acct!=="all"?"Try a different search or account.":"New requests will show up here on their own."}</div>`;
  const row=p=>{
    let end;
    if(p.state==="ready"){const n=keep(p).length;end=`<span class="outcome c-${TONE[p.verdict]}">${VERDICT_ICON[p.verdict](15)}${verdictWord(p)}</span><span class="row-count">${n?plural(n,"issue"):"No issues"}</span>`}
    else if(p.state==="running") end=`<span class="outcome c-accent" data-pt="${p.id}">Reviewing… ${p.progress}%</span><div class="bar"><i data-pb="${p.id}" style="width:${p.progress}%"></i></div>`;
    else if(p.state==="queued") end=`<span class="outcome c-muted">Up next</span>`;
    else end=`<span class="outcome c-muted">${ICON.check(15)}Review sent</span>`;
    return `<button class="row" data-a="open" data-v="${p.id}"><span class="row-main"><span class="row-title" style="display:block">${esc(p.title)} ${p.merged?'<span class="tag">Merged</span>':""}</span><span class="row-meta" style="display:block">${esc(short(p.repo))} ${ref(p)} · ${esc(p.author)} · ${p.age}${p.linked?" · added by link":""}</span></span><span class="row-end">${end}</span></button>`};
  const group=(l,arr)=>arr.length?`<h2 class="section-title">${l}</h2>`+arr.map(row).join(""):"";
  return group("Ready for you",v.filter(p=>p.state==="ready"))+group("Being reviewed",v.filter(p=>p.state==="running"||p.state==="queued"))+group("Finished",v.filter(p=>p.state==="sent"));
}

/* Review */
function viewReview(){
  const p=pr(); if(!p) return viewReviews();
  const unit=PROV[p.provider].unit;
  const head=`<button class="back" data-a="nav" data-v="reviews">← Reviews</button>
   <h1 class="rv-title" tabindex="-1" id="vh">${esc(p.title)}</h1>
   <div class="rv-meta"><span>${esc(short(p.repo))} ${ref(p)}</span>${p.merged?'<span class="tag">Merged</span>':""}<span>${esc(p.author)}</span><span>${p.age}</span>
    <span class="rv-links"><button class="link" data-a="ext">Open on ${PROV[p.provider].name}</button>${reviewed(p)?`<button class="link" data-a="rerun">Review again</button>`:""}${p.linked?`<button class="link" data-a="unlink">Remove from list</button>`:""}</span></div>`;
  if(!reviewed(p)) return `<div class="col">${head}<div id="runBox">${runBox(p)}</div></div>`;
  const tone=TONE[p.verdict];
  const sentNote=p.state==="sent"?`<small>${ICON.check(12)} You sent this review to ${PROV[p.provider].name} as “${SEND[p.sentAs][0]}”.</small>`:
    `<small>${plural(p.stats.kept,"issue")} confirmed. ${p.stats.rejected} false alarm${p.stats.rejected===1?"":"s"} removed before you saw ${p.stats.rejected===1?"it":"them"}. <button class="link" data-a="tab" data-v="checked">See how it was checked</button></small>`;
  const answer=`<section class="answer" style="--tone:var(--${tone});--tone-soft:var(--${tone}-soft)"><div class="answer-word">${VERDICT_ICON[p.verdict](20)}${verdictWord(p)}</div><p>${esc(p.summary)}</p>${compLine(p)}${sentNote}</section>`;
  const tab=S.tab[p.id]||"issues";
  const tabs=[["issues",`Issues (${p.findings.length})`],["reqs","Requirements"],["code","Code changes"],["checked","How it was checked"]];
  const bar=tabs.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${tab===k}" data-a="tab" data-v="${k}">${l}</button>`).join("");
  const body=tab==="issues"?issuesTab(p):tab==="reqs"?reqsTab(p):tab==="code"?codeTab(p):checkedTab(p);
  const n=keep(p).length;
  const send=p.state==="ready"?`<div class="send-bar"><span>${n?`${plural(n,"comment")} will be sent on ${unit==="MR"?"this merge request":"this pull request"}.`:"Nothing is sent until you choose."}</span><button class="btn primary" data-a="send">Send review…</button></div>`:"";
  return `<div class="scroll" id="sc"><div class="col">${head}${answer}<div class="tabs" role="tablist">${bar}</div><div class="tab-body">${body}</div></div></div>${send}`;
}
/* One line per standard on the verdict card. Standards this change doesn't touch are left out to keep it short. */
function compLine(p){
  const shown=(p.compliance||[]).filter(c=>c.status!=="not_applicable");
  if(!shown.length) return "";
  const word={issues:n=>`<span class="c-red">${plural(n,"issue")}</span>`,pass:()=>`<span class="c-green">passed</span>`,needs_check:()=>`<span class="c-amber">needs a check</span>`};
  return `<div class="comp-line">${ICON.shield(15)}${shown.map(c=>{const n=p.findings.filter(f=>(f.controls||[]).some(x=>x.startsWith(STD_SHORT[c.id]))).length||1;
    return `<span><b>${esc(STD_SHORT[c.id])}</b> ${word[c.status](n)}</span>`}).join("")}<button class="link" data-a="tab" data-v="checked">Details</button></div>`;
}
function runBox(p){
  if(p.state==="queued") return `<section class="answer" style="--tone:var(--text-2);--tone-soft:var(--card-2)"><div class="answer-word">Up next</div><p>This review starts when the current one finishes. They run one at a time to protect your Claude usage limits.</p></section>`;
  const g=p.progress, done=[g>=12,g>=70,g>=92,false];
  const now=done.findIndex(x=>!x);
  const finished=Math.min(6,Math.max(0,Math.floor((g-12)/58*6)));
  const steps=[
   ["Reading the change",`Finding the requirements and project rules, and detecting the tech stack: ${p.stack.join(", ")}.`],
   ["Checking the code",`${finished} of 6 specialists finished: architecture, performance, security, correctness, tech stack and requirements.`],
   ["Double-checking the findings","A separate reviewer tries to prove each finding wrong, so you only see real ones."],
   ["Writing the verdict","The lead reviewer makes the final call."]];
  return `<section class="answer" style="--tone:var(--accent);--tone-soft:var(--accent-soft)"><div class="answer-word">Reviewing… ${g}%</div><p>You can leave this page. You'll be notified when it's ready.</p></section>
   <div class="steps">${steps.map(([t,sub],i)=>`<div class="step ${i<now?"done":i===now?"now":""}"><span class="step-i">${i<now?ICON.check(12):""}</span><div><b>${t}</b>${i===now?`<small>${esc(sub)}</small>`:""}</div></div>`).join("")}</div>`;
}
function issuesTab(p){
  if(!p.findings.length) return `<div class="empty"><b>No issues worth mentioning</b>${plural(p.stats.raised,"possible issue")} checked and ruled out.</div>`;
  const open=S.open[p.id]===undefined?p.findings[0].id:S.open[p.id];
  return p.findings.map(f=>{
    const key=p.id+f.id, isOpen=open===f.id, off=!!S.off[key];
    return `<article class="issue ${isOpen?"open":""} ${off?"off":""}" id="i-${f.id}"><button class="issue-head" data-a="issue" data-v="${f.id}" aria-expanded="${isOpen}"><span class="sev s-${f.sev}">${SEV[f.sev]}</span><span class="issue-title">${esc(f.title)}</span><svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 4 4 4-4"/></svg></button>${isOpen?issueBody(p,f,key,off):""}</article>`}).join("");
}
function snippet(p,f){
  const file=p.files.find(x=>x.path===f.file); if(!file) return "";
  const lines=file.lines.filter(l=>l.k!=="hunk"&&l.k!=="del"&&l.n>=f.line-1&&l.n<=f.line+2);
  while(lines.length&&!lines[lines.length-1].t.trim()) lines.pop();
  return `<div class="code-head"><span>${esc(f.file.split("/").pop())}, line ${f.line}</span></div><pre class="code">${lines.map(l=>`<span class="ln ${l.n===f.line?"hit":""}">${highlight(l.t)||" "}</span>`).join("")}</pre>`;
}
const commentText=(f)=>`${f.problem}\n\n${f.better}`+(f.controls?`\n\nRelated controls: ${f.controls.join(", ")}`:"");
function issueBody(p,f,key,off){
  const source=(f.rule?`<div class="source">${ICON.doc(14)}<span>${f.ruleDoc?"From your document: ":"Based on: "}${esc(f.rule)}</span></div>`:"")+
    (f.controls?`<div class="source">${ICON.shield(14)}<span>Breaks ${f.controls.map(x=>`<span class="ctl">${esc(x)}</span>`).join("")}</span></div>`:"");
  const edit=S.editing[key]?`<form class="inline-form" data-form="edit" data-v="${key}"><label class="field" style="margin:0">Your comment<textarea class="input" rows="4" name="t">${esc(S.edit[key]||commentText(f))}</textarea></label><div class="acts"><button class="btn small primary">Save</button><button class="btn small" type="button" data-a="editclose">Cancel</button></div></form>`:(S.edit[key]?`<div class="qa"><b>Your edited comment</b><span style="white-space:pre-wrap">${esc(S.edit[key])}</span></div>`:"");
  const asks=(S.asks[key]||[]).map(x=>`<div class="qa"><b>${esc(x.q)}</b><span>${esc(x.a)}</span></div>`).join("");
  const ask=S.asking[key]?`<form class="inline-form" data-form="ask" data-v="${key}"><input class="input" name="q" placeholder="For example: is this really a problem at our traffic?" aria-label="Your question" autocomplete="off"><div class="acts"><button class="btn small primary">Ask</button><button class="btn small" type="button" data-a="askclose">Close</button></div></form>`:"";
  return `<div class="issue-body">
   <h4>What's wrong</h4><p>${esc(f.problem)}</p>
   ${snippet(p,f)}
   <h4>What could happen</h4><p>${esc(f.impact)}</p>
   <div class="better-box"><h4>A better way</h4><p>${esc(f.better)}</p>${f.code?`<pre class="code">${f.code.split("\n").map(highlight).join("\n")}</pre><button class="link" style="margin-top:8px" data-a="copy" data-v="${f.id}">Copy code</button>`:""}</div>
   ${source}
   <div class="source">${ICON.check(14)}<span>${esc(f.proof)}</span></div>
   ${edit}${asks}${ask}
   ${p.state==="ready"?`<div class="issue-foot"><label class="toggle"><button class="switch" role="switch" aria-checked="${!off}" aria-label="Include in my review" data-a="include"></button>Include in my review</label><span class="right"><button class="link" data-a="ask">Ask a question</button><button class="link" data-a="edit">Edit comment</button></span></div>`:""}
  </div>`;
}
function statusRow(st){
  const m={met:[ICON.check,"c-green","Done"],partial:[ICON.warn,"c-amber","Partly done"],missing:[ICON.cross,"c-red","Missing"],unclear:[ICON.ask,"c-muted","Unclear"]}[st];
  return [m[0](16),m[1],m[2]];
}
function activeDocs(repo){return PROJECTS[repo].docs.concat(PROJECTS["*"].docs).filter(x=>x.on&&x.status==="ready")}
function reqsTab(p){
  const docs=activeDocs(p.repo), rules=PROJECTS[p.repo].rules.concat(PROJECTS["*"].rules);
  const reqs=p.requirements.length?`<div class="list">${p.requirements.map(r=>{const[i,cl,w]=statusRow(r.st);return `<div class="li"><span class="icon ${cl}">${i}</span><div class="li-main"><b>${esc(r.r)}</b><small>${esc(r.ev)}</small></div><div class="li-end"><span class="${cl}" style="font-weight:500">${w}</span></div></div>`}).join("")}</div>`:`<div class="empty"><b>No written requirements found</b>This change has no linked ticket or description to compare against.</div>`;
  const used=docs.map(x=>`<div class="li center"><span class="icon c-muted">${ICON.doc(16)}</span><div class="li-main"><b>${esc(x.name)}</b></div><div class="li-end c-muted">${x.level==="must"?"Must follow":"Recommended"}</div></div>`).join("")+
    (rules.length?`<div class="li center"><span class="icon c-muted">${ICON.check(16)}</span><div class="li-main"><b>${plural(rules.length,"quick rule")}</b></div></div>`:"")+
    `<div class="li center"><span class="icon c-muted">${ICON.doc(16)}</span><div class="li-main"><b>${plural(p.guidelines.length,"file")} from the project</b><small>${esc(p.guidelines.join(", "))}</small></div></div>`;
  return `<h2 class="section-title">Does it do what was asked?</h2>${reqs}
   <h2 class="section-title">Project rules used in this review</h2><div class="list">${used}</div>
   <p style="margin-top:10px"><button class="link" data-a="goproject" data-v="${esc(p.repo)}">Add guideline documents for ${esc(short(p.repo))}</button></p>`;
}
function codeTab(p){
  return p.files.map(file=>`<div class="file"><div class="file-name">${esc(file.path)}</div><div class="diff">${file.lines.map(l=>{
    if(l.k==="hunk") return `<div class="dl hunk">${esc(l.t)}</div>`;
    const hit=l.k!=="del"&&p.findings.find(f=>f.file===file.path&&f.line===l.n);
    const row=`<div class="dl ${l.k}"><span class="n">${l.n||l.o||""}</span><span class="g">${l.k==="add"?"+":l.k==="del"?"−":""}</span><span>${highlight(l.t)||" "}</span></div>`;
    return row+(hit?`<div class="dl-flag"><button class="sev s-${hit.sev}" data-a="jump" data-v="${hit.id}" title="Open this issue">${esc(SEV[hit.sev])}: ${esc(hit.title)}</button></div>`:"");
  }).join("")}</div></div>`).join("");
}
function checkedTab(p){
  const comp=(p.compliance||[]).length?`<h2 class="section-title">Compliance and standards</h2><div class="list">${p.compliance.map(c=>{const[r,cl]=COMP_RESULT[c.status];
    return `<div class="li"><span class="icon c-muted">${ICON.shield(16)}</span><div class="li-main"><b>${esc(STD[c.id].name)}</b><small>${esc(c.note)}</small></div><div class="li-end"><span class="${cl}" style="font-weight:500">${r}</span></div></div>`}).join("")}</div>
   <p class="note">Checked against each standard's code-level controls. This doesn't make the project compliant or replace an audit.</p>`:"";

const ALLOWED=["pdf","docx","md","txt"], MAX=25*1048576;
function addFiles(list){
  const pj=PROJECTS[S.project]; if(!pj) return;
  const bad=[];
  [...list].forEach(f=>{
    const ext=f.name.split(".").pop().toLowerCase();
    if(!ALLOWED.includes(ext)||!f.name.includes(".")){bad.push(`“${f.name}” isn't a supported file type. Use PDF, Word (.docx), Markdown or text.`);return}
    if(f.size>MAX){bad.push(`“${f.name}” is larger than 25 MB.`);return}
    if(f.size===0){bad.push(`“${f.name}” is empty.`);return}
    if(pj.docs.some(x=>x.name===f.name)){bad.push(`“${f.name}” has already been added.`);return}
    const x={id:"d"+docSeq++,name:f.name,size:f.size,level:"must",on:true,status:"reading",added:"Added just now"};
    pj.docs.push(x);
    setTimeout(()=>{x.status="ready";S.justAdded={repo:S.project,name:x.name};safeRender()},900);
  });
  S.uploadError=bad.join(" ");
  render();
}

/* Review by link. Works for open, closed and merged changes on any connected account. */
function parseLink(raw){
  const s=raw.trim(); if(!s) return null;
  let u; try{u=new URL(/^https?:\/\//i.test(s)?s:"https://"+s)}catch(e){return {err:"Paste the full link to a pull request or merge request."}}
  const parts=u.pathname.split("/").filter(Boolean), dash=parts.indexOf("-");
  let found=null;
  if(dash>=2&&parts[dash+1]==="merge_requests"&&/^\d+$/.test(parts[dash+2]||"")) found={provider:"gitlab",repo:parts.slice(0,dash).join("/"),num:+parts[dash+2]};
  else if(parts.length>=4&&parts[2]==="pull"&&/^\d+$/.test(parts[3])) found={provider:"github",repo:parts[0]+"/"+parts[1],num:+parts[3]};
  else if(parts.length>=4&&parts[2]==="pull-requests") return {err:"Bitbucket links aren't supported yet."};
  if(!found) return {err:"This doesn't look like a link to a pull request or merge request."};
  const host=u.host.toLowerCase();
  // The account decides the service, so company servers on any address work.
  const acct=S.accounts.find(a=>a.on&&a.host===host);
  if(!acct) return {err:`No account for ${host} is connected. Connect it in Settings first, so Code Reviewer can read this ${found.provider==="gitlab"?"merge request":"pull request"}.`};
  if(acct.p!==found.provider) return {err:`${host} is connected as ${PROV[acct.p].name}, but this is a ${PROV[found.provider].name} link.`};
  const existing=PRS.find(p=>p.provider===found.provider&&p.repo===found.repo&&p.num===found.num);
  return {...found,host,existing};
}

  openDlg(`<div class="d-head"><h2>Send your review</h2><p>To ${esc(short(p.repo))} ${ref(p)} on ${PROV[p.provider].name}, under your name.</p></div>
  <div class="d-body">${mergedNote}${kinds.map(k=>`<label class="choice"><input type="radio" name="sendas" value="${k}" ${k===pre?"checked":""}><span><b>${SEND[k][0]}${k===pre?" (suggested)":""}</b><small>${SEND[k][1]}</small></span></label>`).join("")}
  <p style="font-size:14px;color:var(--text-2);margin-top:12px">Includes the summary and ${plural(n,"comment")}.${dis?` ${plural(dis,"issue")} you turned off won't be sent.`:""}</p></div>
  <div class="d-foot"><button class="btn" data-a="dlgclose">Cancel</button><button class="btn primary" data-a="confirmsend" autofocus>Send review</button></div>`);
}
function addAcctDlg(){
  openDlg(`<div class="d-head"><h2>Add an account</h2><p>You'll sign in through your browser.</p></div><div class="d-body">
  <label class="field">Service<select class="input" id="newProv"><option value="github">GitHub or GitHub Enterprise</option><option value="gitlab">GitLab</option><option value="bitbucket">Bitbucket</option></select></label>
  <label class="field">Server address<input class="input" id="newHost" placeholder="git.yourcompany.com" autocomplete="off"></label><p class="up-error" id="hostErr" hidden>Enter the server address.</p></div>
  <div class="d-foot"><button class="btn" data-a="dlgclose">Cancel</button><button class="btn primary" data-a="confirmacct">Continue</button></div>`);
}
function keysDlg(){
  const k=(c,t)=>`<span>${c}</span><span>${t}</span>`;
  openDlg(`<div class="d-head"><h2>Keyboard shortcuts</h2></div><div class="d-body"><div class="keys">
  ${k(`<kbd>${isMac()?"⌘":"Ctrl"} K</kbd>`,"Search everything")}${k("<kbd>J</kbd> <kbd>K</kbd>","Next or previous issue")}${k("<kbd>X</kbd>","Include or exclude the open issue")}${k("<kbd>S</kbd>","Send review")}${k("<kbd>Esc</kbd>","Go back")}${k("<kbd>?</kbd>","Show this list")}
  </div></div><div class="d-foot"><button class="btn" data-a="dlgclose" autofocus>Close</button></div>`);
}
let palItems=[];
const ACTIONS=()=>[
  ...PRS.filter(p=>connected(p.provider)).map(p=>({l:p.title,s:`${short(p.repo)} ${ref(p)}`,run:()=>openReview(p.id)})),
  ...Object.keys(PROJECTS).filter(r=>r!=="*").map(r=>({l:`Add guidelines to ${short(r)}`,s:"Project",run:()=>nav("project",{project:r})})),
  {l:"Reviews",s:"Go to",run:()=>nav("reviews")},{l:"Projects",s:"Go to",run:()=>nav("projects")},{l:"Settings",s:"Go to",run:()=>nav("settings")},{l:"Review a pull request by link",s:"Action",run:linkDlg},{l:"Add an account",s:"Action",run:addAcctDlg},{l:"Keyboard shortcuts",s:"Help",run:keysDlg}];
function paletteDlg(){ S.palIdx=0; openDlg(`<input class="palette-input" id="palInput" placeholder="Search reviews, projects and actions" aria-label="Search" autocomplete="off"><div class="palette-list" id="palList"></div>`); renderPal(""); $("palInput").focus(); }
function renderPal(q){ palItems=ACTIONS().filter(x=>(x.l+" "+x.s).toLowerCase().includes(q.toLowerCase())); S.palIdx=Math.min(S.palIdx,Math.max(0,palItems.length-1));
  $("palList").innerHTML=palItems.length?palItems.map((x,i)=>`<button class="pal ${i===S.palIdx?"sel":""}" data-a="palrun" data-v="${i}"><span>${esc(x.l)}</span><small>${esc(x.s)}</small></button>`).join(""):`<div class="empty" style="border:0;background:none">No matches</div>`; }

function openReview(id){ nav("review",{sel:id}); }
function startRun(p){ p.state=PRS.some(x=>x.state==="running"&&x!==p)?"queued":"running"; p.progress=2; delete S.tab[p.id]; }
function moveIssue(dir){ const p=pr(); if(!p||!reviewed(p)||!p.findings.length) return; S.tab[p.id]="issues"; const cur=S.open[p.id]===undefined?p.findings[0].id:S.open[p.id]; const i=p.findings.findIndex(f=>f.id===cur); S.open[p.id]=p.findings[(i+dir+p.findings.length)%p.findings.length].id; render(); const el=$("i-"+S.open[p.id]); if(el) el.scrollIntoView({block:"nearest"}); }
function curFinding(p){ const id=S.open[p.id]===undefined?p.findings[0]&&p.findings[0].id:S.open[p.id]; return p.findings.find(f=>f.id===id); }
function setTheme(t){ S.theme=t; const dark=matchMedia("(prefers-color-scheme: dark)").matches; document.documentElement.dataset.theme=t==="system"?(dark?"dark":"light"):t; try{localStorage.setItem("verdict-theme",t)}catch(e){} }
function setOS(os){ const x=$("app"); x.classList.remove("os-win","os-mac","os-linux"); x.classList.add("os-"+os); }

/* Simulated review progress, so the design can show a review arriving */
setInterval(()=>{
  const p=PRS.find(x=>x.state==="running");
  if(!p){ const q=PRS.find(x=>x.state==="queued"&&S.opts.auto); if(q){q.state="running";q.progress=q.progress||2;safeRender();} return; }
  p.progress=Math.min(100,p.progress+3);
  if(p.progress>=100){ p.state="ready"; safeRender(); if(S.opts.notify) toast(`Review ready: ${p.title}`,"Open",()=>openReview(p.id)); return; }
  document.querySelectorAll(`[data-pb="${p.id}"]`).forEach(e=>e.style.width=p.progress+"%");
  document.querySelectorAll(`[data-pt="${p.id}"]`).forEach(e=>e.textContent=`Reviewing… ${p.progress}%`);
  if(S.view==="review"&&S.sel===p.id&&$("runBox")) $("runBox").innerHTML=runBox(p);
},1500);

document.addEventListener("click",e=>{
  if(e.target===$("dlg")) return closeDlg();
  const b=e.target.closest("[data-a]"); if(!b) return;
  const v=b.dataset.v, p=pr(), act=b.dataset.a, key=p&&curFinding(p)?p.id+curFinding(p).id:null;
  switch(act){
    case "nav": nav(v); break;
    case "open": openReview(v); break;
    case "tab": S.tab[p.id]=v; S.keepScroll=true; render(); break;
    case "issue": S.open[p.id]=(S.open[p.id]===undefined?p.findings[0].id:S.open[p.id])===v?null:v; render(); break;
    case "jump": S.tab[p.id]="issues"; S.open[p.id]=v; S.keepScroll=true; render(); { const el=$("i-"+v); if(el) el.scrollIntoView({block:"start"}); } break;
    case "include": e.preventDefault(); S.off[key]=!S.off[key]; render(); break;
    case "edit": S.editing[key]=true; render(); { const t=$("main").querySelector('form[data-form="edit"] textarea'); if(t) t.focus(); } break;
    case "editclose": S.editing[key]=false; render(); break;
    case "ask": S.asking[key]=true; render(); { const t=$("main").querySelector('form[data-form="ask"] input'); if(t) t.focus(); } break;
    case "askclose": S.asking[key]=false; render(); break;
    case "copy": { const f=p.findings.find(x=>x.id===v); try{navigator.clipboard.writeText(f.code).catch(()=>{})}catch(err){} toast("Code copied."); break; }
    case "ext": toast(`This would open ${ref(p)} in your browser.`); break;
    case "rerun": startRun(p); render(); break;
    case "send": sendDlg(); break;
    case "dlgclose": closeDlg(); break;
    case "confirmsend": { const as=$("dlg").querySelector("input[name=sendas]:checked").value; p.state="sent"; p.sentAs=as; closeDlg(); render();
      const nxt=PRS.find(x=>x.state==="ready"&&connected(x.provider)); toast("Sample only: nothing was actually posted.",nxt?"Next review":null,nxt?()=>openReview(nxt.id):null); break; }
    case "goproject": nav("project",{project:v}); break;
    case "pick": $("filePick").click(); break;
    case "docon": { const x=docById(v); x.on=!x.on; render(); break; }
    case "docrm": { const pj=PROJECTS[S.project], i=pj.docs.findIndex(x=>x.id===v), x=pj.docs[i]; pj.docs.splice(i,1); if(S.justAdded&&S.justAdded.name===x.name) S.justAdded=null; render(); toast(`Removed “${x.name}”.`,"Undo",()=>{pj.docs.splice(i,0,x);render()}); break; }
    case "rulerm": PROJECTS[S.project].rules.splice(+v,1); render(); break;
    case "recheck": { const ps=PRS.filter(x=>x.state==="ready"&&connected(x.provider)&&(S.project==="*"||x.repo===S.project)); ps.forEach(startRun); const n=ps.length; S.justAdded=null; S.stdAdded=null; render(); toast(`Reviewing ${plural(n,"change")} again.`); break; }
    case "stdpicker": stdDlg(); break;
    case "linkdlg": linkDlg(); break;
    case "unlink": { const i=PRS.indexOf(p); PRS.splice(i,1); nav("reviews"); toast("Removed from your list.","Undo",()=>{PRS.splice(i,0,p);render()}); break; }
    case "stdadd": { const pj=PROJECTS[S.project], ids=[...S.pick.sel]; ids.forEach(id=>pj.std.push({id,level:"must"})); closeDlg();
      S.stdAdded={repo:S.project,n:ids.length,names:ids.map(id=>STD_SHORT[id]).join(", ")}; render(); toast(`Added ${plural(ids.length,"standard")}.`); break; }
    case "stdrm": { const pj=PROJECTS[S.project], i=pj.std.findIndex(x=>x.id===v), x=pj.std[i]; pj.std.splice(i,1); render(); toast(`Removed ${STD[x.id].name}.`,"Undo",()=>{pj.std.splice(i,0,x);render()}); break; }
    case "opt": S.opts[v]=!S.opts[v]; render(); break;
    case "depth": S.depth=v; render(); break;
    case "theme": setTheme(v); render(); break;
    case "keys": keysDlg(); break;
    case "checkclaude": toast("Claude Code is signed in with your subscription."); break;
    case "acct": { S.accounts[+v].on=!S.accounts[+v].on; if(S.acct!=="all"&&!connected(S.acct)) S.acct="all"; render(); break; }
    case "addacct": addAcctDlg(); break;
    case "confirmacct": { const host=$("newHost").value.trim(); if(!host){$("hostErr").hidden=false;$("newHost").focus();break}
      S.accounts.push({p:$("newProv").value,host,user:"shailesh",repos:0,on:true}); closeDlg(); render(); toast(`Sample only: ${host} added.`); break; }
    case "palette": paletteDlg(); break;
    case "palrun": { const it=palItems[+v]; closeDlg(); it.run(); break; }
  }
});
document.addEventListener("submit",e=>{
  const f=e.target, kind=f.dataset.form; if(!kind) return; e.preventDefault();
  if(kind==="edit"){ const key=f.dataset.v; S.edit[key]=f.elements.t.value.trim(); S.editing[key]=false; document.activeElement.blur(); render(); toast("Comment updated."); }
  if(kind==="ask"){ const key=f.dataset.v, q=f.elements.q.value.trim(); if(!q) return f.elements.q.focus(); const p=pr(), fd=p.findings.find(x=>p.id+x.id===key);
    (S.asks[key]=S.asks[key]||[]).push({q,a:`Sample answer: ${fd.impact} ${fd.proof}`}); S.asking[key]=false; document.activeElement.blur(); render(); }
  if(kind==="link"){ const r=parseLink($("linkIn").value); if(!r||r.err) return $("linkIn").focus(); closeDlg();
    if(r.existing) return openReview(r.existing.id);
    if(!PROJECTS[r.repo]) PROJECTS[r.repo]={docs:[],rules:[],std:[]};
    const p=linkedSample(r); PRS.unshift(p); startRun(p); openReview(p.id); return; }
  if(kind==="rule"){ const t=f.elements.t.value.trim(); if(!t) return f.elements.t.focus(); PROJECTS[S.project].rules.push(t); render(); const inp=$("main").querySelector('form[data-form="rule"] input'); if(inp) inp.focus(); }
});
document.addEventListener("input",e=>{
  if(e.target.id==="palInput"){S.palIdx=0;renderPal(e.target.value)}
  if(e.target.id==="q"){S.q=e.target.value;$("homeList").innerHTML=homeList()}
  if(e.target.id==="stdQ"){S.pick.q=e.target.value;renderPicker()}
  if(e.target.id==="linkIn") linkInfo();
});
document.addEventListener("change",e=>{
  if(e.target.id==="acctFilter"){S.acct=e.target.value;$("homeList").innerHTML=homeList()}
  if(e.target.id==="filePick"){addFiles(e.target.files);e.target.value=""}
  if(e.target.dataset.c==="doclevel"){docById(e.target.dataset.v).level=e.target.value}
  if(e.target.dataset.c==="stdlevel"){PROJECTS[S.project].std.find(x=>x.id===e.target.dataset.v).level=e.target.value}
  if(e.target.dataset.c==="stdpick"){const id=e.target.value; e.target.checked?S.pick.sel.add(id):S.pick.sel.delete(id); pickerCount()}
});
document.addEventListener("focusout",()=>{setTimeout(()=>{const ae=document.activeElement; if(S.dirty&&!(ae&&/INPUT|TEXTAREA/.test(ae.tagName))&&!$("dlg").open) render()},0)});
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>e.preventDefault());
document.addEventListener("keydown",e=>{
  const open=$("dlg").open;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault(); return open?closeDlg():paletteDlg();}
  if(open){ if($("palInput")){
      if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault(); if(!palItems.length) return; S.palIdx=(S.palIdx+(e.key==="ArrowDown"?1:-1)+palItems.length)%palItems.length; renderPal($("palInput").value);}
      if(e.key==="Enter"&&palItems[S.palIdx]){e.preventDefault();const it=palItems[S.palIdx]; closeDlg(); it.run();} }
    return; }
  if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const k=e.key.toLowerCase();
  if(k==="?") return keysDlg();
  if(k==="escape"){ if(S.view==="review") nav("reviews"); else if(S.view==="project") nav("projects"); return; }
  if(S.view!=="review") return;
  const p=pr(); if(!p||!reviewed(p)) return;
  if(k==="j") moveIssue(1); else if(k==="k") moveIssue(-1);
  else if(k==="x"&&p.state==="ready"&&curFinding(p)){ const key=p.id+curFinding(p).id; S.off[key]=!S.off[key]; render(); }
  else if(k==="s"&&p.state==="ready") sendDlg();
});

/* Boot */
(function(){
  const q=new URLSearchParams(location.search);
  let t=null; try{t=localStorage.getItem("verdict-theme")}catch(e){}
  setTheme(q.get("theme")||t||"system");
  const ua=navigator.platform||""; setOS(q.get("os")||(/Mac/.test(ua)?"mac":/Linux/.test(ua)?"linux":"win"));
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(S.theme==="system")setTheme("system")});
  const [v,arg]=location.hash.slice(1).split("/");
  if(v==="review"&&PRS.some(p=>p.id===arg)){S.view="review";S.sel=arg}
  else if(v==="project"&&PROJECTS[decodeURIComponent(arg||"")]){S.view="project";S.project=decodeURIComponent(arg)}
  else if(["projects","settings"].includes(v)) S.view=v;
  if(q.get("tab")&&S.sel) S.tab[S.sel]=q.get("tab");
  render();
})();
</script>
</body>
